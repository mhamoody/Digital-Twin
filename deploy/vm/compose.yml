services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_digital_twin
      POSTGRES_USER: digital_twin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.vm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_twin -d course_digital_twin"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      DIGITAL_TWIN_DATABASE_URL: postgresql+psycopg://digital_twin:${POSTGRES_PASSWORD}@db:5432/course_digital_twin
      DIGITAL_TWIN_LMS_SHARED_SECRET: ${DIGITAL_TWIN_LMS_SHARED_SECRET:-}
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python -m uvicorn digital_twin.api.app:app --app-dir src --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: ../..
    restart: unless-stopped
    environment:
      DIGITAL_TWIN_API_URL: http://api:8000
      DIGITAL_TWIN_AUTH_FILE: /run/digital-twin/instructors.json
      DIGITAL_TWIN_PRESENTATION_ID: ${DIGITAL_TWIN_PRESENTATION_ID:-moodle-replay:AAA:2030A}
    command:
      - python
      - -m
      - streamlit
      - run
      - src/digital_twin/dashboard/app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
      - --browser.gatherUsageStats
      - "false"
    volumes:
      - ../../var/auth/instructors.json:/run/digital-twin/instructors.json:ro
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env.vm}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
