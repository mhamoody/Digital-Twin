[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "course-digital-twin"
version = "0.1.0"
description = "Gated vertical-slice prototype for a course-level student digital twin"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.112,<1.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<4.0",
    "pydantic>=2.8,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "streamlit>=1.37,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
